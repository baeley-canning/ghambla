[project]
name = "ghambla"
version = "0.1.0"
description = "Automated trading research platform"
requires-python = ">=3.12"
# ib_async is only imported inside IBKRBroker.connect(), so the research and
# backtest paths run without it. It is declared here because it was installed
# in the venv but undeclared — a fresh clone had no way to know it was needed.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
broker = ["ib_async>=2.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
